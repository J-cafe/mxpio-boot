mxpio.multitenant.masterDatabaseName=mboot
mxpio.multitenant.disableRegister=false
mxpio.multitenant.organizationIdRegExp=^[a-zA-Z]\w*
mxpio.multitenant.databaseNameSuffix=
mxpio.multitenant.databaseNamePrefix=mboot_
# 租户库表结构由 Hibernate ddl-auto 自动生成/更新（嵌入式数据库固定 create-drop）
mxpio.multitenant.ddl-auto=update
# 建库后的表结构/DDL 脚本（留空时按 fallback 加载 multitenant-{platform}.sql + multitenant.sql）
mxpio.multitenant.resourceScript=
# 建表完成后的种子数据脚本
mxpio.multitenant.dataScript=classpath*:data.sql
mxpio.multitenant.packagesToScan=com.mxpioframework.**.entity
mxpio.multitenant.customPackagesToScan=
